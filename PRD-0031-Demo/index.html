<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRD-0031 Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{text-align:center;max-width:600px;padding:40px}
h1{font-size:28px;color:#1a1a2e;margin-bottom:8px}
p{color:#666;margin-bottom:32px;font-size:15px}
.cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
a.card{display:block;background:#fff;border-radius:16px;padding:32px 24px;width:260px;text-decoration:none;box-shadow:0 4px 16px rgba(0,0,0,.08);transition:all .2s}
a.card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.card .icon{font-size:48px;margin-bottom:12px}
.card h2{font-size:18px;color:#1a1a2e;margin-bottom:6px}
.card p{font-size:13px;color:#888;margin-bottom:0}
.badge{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:500}
.badge-blue{background:#eef1ff;color:#667eea}
.badge-green{background:#e8f8e8;color:#27ae60}
.footer{margin-top:40px;font-size:12px;color:#bbb}
</style>
</head>
<body>
<div class="container">
<h1>PRD-0031 交互原型</h1>
<p>冻结余额 + 双 AML 锁 — 点击预览</p>
<div class="cards">
<a class="card" href="user-demo.html">
<div class="icon">📱</div>
<h2>用户端 Demo</h2>
<p>手机三屏：钱包 / 场馆 / 提现</p>
<span class="badge badge-blue">可交互模拟</span>
</a>
<a class="card" href="admin-demo.html">
<div class="icon">🖥️</div>
<h2>后台 Demo</h2>
<p>发券 / 冻结查询 / AML监控</p>
<span class="badge badge-green">三个 Tab 页面</span>
</a>
</div>
<div class="footer">HashRace Platform · PRD-0031 评审稿</div>
</div>
</body>
</html>
